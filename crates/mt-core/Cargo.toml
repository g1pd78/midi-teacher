[package]
name = "mt-core"
version = "0.1.0"
edition = "2021"

[dependencies]
anyhow = "1.0.104"
cpal = "0.18.2"
crossbeam-channel = "0.5.17"
crossbeam-queue = "0.3"
log = "0.4.34"
midir = "0.11.0"
midly = { version = "0.5.3", default-features = false, features = ["std"] }
parking_lot = "0.12.5"
rusqlite = { version = "0.40.2", features = ["bundled"] }
rustysynth = "1.3.6"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"

[features]
# ASIO-вывод на Windows (нужны LLVM/clang при сборке; SDK скачивается автоматически).
asio = ["cpal/asio"]
