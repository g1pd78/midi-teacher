[package]
name = "mt-core"
version = "0.1.0"
edition = "2021"

[dependencies]
anyhow = "1.0.104"
cpal = "0.18.2"
crossbeam-channel = "0.5.17"
log = "0.4.34"
midir = "0.11.0"
parking_lot = "0.12.5"
rustysynth = "1.3.6"
serde = { version = "1.0.229", features = ["derive"] }

[dev-dependencies]
serde_json = "1.0.151"

[features]
# ASIO-вывод на Windows (нужны LLVM/clang при сборке; SDK скачивается автоматически).
asio = ["cpal/asio"]
