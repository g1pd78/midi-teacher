name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    name: Проверки и тесты (Linux)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Системные библиотеки (WebKitGTK, ALSA)
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev librsvg2-dev \
            libayatana-appindicator3-dev libasound2-dev libssl-dev pkg-config

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - uses: Swatinem/rust-cache@v2

      - run: npm ci
      - name: TypeScript
        run: npm run typecheck
      - name: Тесты интерфейса
        run: npm test
      - name: Сборка интерфейса
        run: npm run build

      - name: rustfmt
        run: cargo fmt --all --check
      - name: clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Тесты Rust
        run: cargo test --workspace

  e2e:
    name: Сквозной тест (приложение целиком)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Системные библиотеки, WebKitWebDriver, Xvfb
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev librsvg2-dev \
            libayatana-appindicator3-dev libasound2-dev libssl-dev pkg-config \
            webkit2gtk-driver xvfb

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: tauri-driver
        run: cargo install tauri-driver --locked

      - run: npm ci

      - name: Сборка приложения (debug)
        run: npx tauri build --debug --no-bundle

      - name: Бот играет серию тренажёра
        run: xvfb-run -a node e2e/run.mjs
        env:
          WEBKIT_DISABLE_COMPOSITING_MODE: 1

  build-windows:
    name: Установщик для Windows
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      # ASIO: bindgen нужен libclang; LLVM предустановлен на windows-latest.
      # ASIO SDK скачивает сам скрипт сборки asio-sys.
      - name: LLVM для ASIO
        shell: pwsh
        run: |
          if (-not (Test-Path "C:\Program Files\LLVM\bin\libclang.dll")) { choco install llvm -y --no-progress }
          "LIBCLANG_PATH=C:\Program Files\LLVM\bin" | Out-File -FilePath $env:GITHUB_ENV -Append

      - run: npm ci

      - name: SoundFont рояля
        run: node scripts/fetch-soundfont.mjs --optional

      - name: Сборка
        run: npx tauri build

      - uses: actions/upload-artifact@v5
        with:
          name: MIDI-Teacher-windows-${{ github.sha }}
          path: target/release/bundle/nsis/*.exe
          if-no-files-found: error

  firmware:
    name: Прошивка подсветки (ESP32-S3)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Тест логики платы (g++)
        run: |
          g++ -std=c++17 -Wall -Wextra -Werror -I hardware/key-lights/firmware/MIDITeacherLights \
            hardware/key-lights/firmware/test/lights_core_test.cpp -o lights_core_test
          ./lights_core_test
          g++ -std=c++17 -Wall -Wextra -Werror -I hardware/key-lights/firmware/MIDITeacherLights \
            hardware/key-lights/firmware/test/radio_core_test.cpp -o radio_core_test
          ./radio_core_test

      - uses: arduino/setup-arduino-cli@v2

      - name: Ядро esp32 и библиотека NeoPixel
        run: |
          URL=https://espressif.github.io/arduino-esp32/package_esp32_index.json
          arduino-cli core update-index --additional-urls "$URL"
          arduino-cli core install esp32:esp32@3.1.1 --additional-urls "$URL"
          arduino-cli lib install "Adafruit NeoPixel"

      - name: Сборка (USB-OTG TinyUSB → USB-MIDI)
        run: |
          arduino-cli compile --fqbn esp32:esp32:esp32s3:USBMode=default --export-binaries \
            --output-dir build hardware/key-lights/firmware/MIDITeacherLights
          ls -l build
          cp build/MIDITeacherLights.ino.merged.bin MIDI-Teacher-Lights-esp32s3.bin

      - uses: actions/upload-artifact@v5
        with:
          name: MIDI-Teacher-Lights-esp32s3-${{ github.sha }}
          path: MIDI-Teacher-Lights-esp32s3.bin
          if-no-files-found: error
