# Разовый поиск нотных исходников в общественном достоянии (Mutopia Project)
# для встроенной библиотеки. Результат печатается в лог. Удалить после использования.
name: Fetch sources

on:
  push:
    paths: [".github/workflows/fetch-sources.yml"]
  workflow_dispatch:

jobs:
  mutopia:
    runs-on: ubuntu-latest
    steps:
      - name: Print LilyPond sources
        run: |
          for url in \
            https://www.mutopiaproject.org/ftp/BachJS/BWVAnh114/anna-magdalena-04/anna-magdalena-04.ly \
            https://www.mutopiaproject.org/ftp/BachJS/BWVAnh114/anna-magdalena-114-115-116/anna-magdalena-114-115-116.ly
          do
            echo "##### BEGIN $url"
            curl -sL "$url" | sed 's/^/| /'
            echo "##### END $url"
          done
          curl -sL "https://www.mutopiaproject.org/cgibin/piece-info.cgi?id=75" | sed -e 's/<[^>]*>/ /g' | grep -iE 'licen|instrument|public|copyright' | head -20
