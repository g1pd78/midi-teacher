# Разовый поиск нотных исходников для встроенной библиотеки (общественное достояние).
# Результат печатается в лог. Удалить после использования.
name: Fetch sources

on:
  push:
    paths: [".github/workflows/fetch-sources.yml"]
  workflow_dispatch:

jobs:
  mutopia:
    runs-on: ubuntu-latest
    steps:
      - name: Minuet in G minor (BWV Anh. 115), keyboard
        run: |
          url=https://www.mutopiaproject.org/ftp/BachJS/BWVAnh115/anna-magdalena-05/anna-magdalena-05.ly
          echo "##### BEGIN $url"
          curl -sL -A "Mozilla/5.0" "$url" | grep -v '^\s*$' | sed 's/^/| /'
          echo "##### END"
